name: Build Signed Android Package (APK + AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (manual, avoids the broken 'tools' package)
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the JDK/Android SDK (no install prompts)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Restore signing keystore
        run: |
          printf '%s' "${{ secrets.MCS_KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d --ignore-garbage > mcs-release.keystore
          ls -la mcs-release.keystore

      - name: Work out the next version code
        id: ver
        run: echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set version code/name for this build
        run: |
          node -e "
            const fs=require('fs');
            const m=JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
            m.appVersionCode = ${{ steps.ver.outputs.code }};
            m.signingKey.path = './mcs-release.keystore';
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
          "

      - name: Generate the Android project from twa-manifest.json
        run: yes "" | bubblewrap init --manifest=./twa-manifest.json --directory=./android-build || true

      - name: Build signed APK + AAB
        working-directory: ./android-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.MCS_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.MCS_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Remove keystore file (keep it out of the uploaded artifact)
        if: always()
        run: rm -f mcs-release.keystore android-build/mcs-release.keystore

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: my-city-shines-android-v${{ steps.ver.outputs.code }}
          path: |
            android-build/app-release-signed.apk
            android-build/app-release-bundle.aab
          retention-days: 90
