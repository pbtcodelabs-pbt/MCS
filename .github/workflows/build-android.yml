name: Build Signed Android Package (APK + AAB)

# صرف ہاتھ سے چلے (Actions → Run workflow) — مالک کی ہدایت: APK/AAB ہر push پر نہیں، صرف مانگنے پر
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (manual, avoids the broken 'tools' package)
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "build-tools;36.1.0"
          ln -s "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" "$ANDROID_SDK_ROOT/bin"

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          npm install --no-save @bubblewrap/core

      - name: Point Bubblewrap at the JDK/Android SDK (no install prompts)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Restore signing keystore
        run: |
          printf '%s' "${{ secrets.MCS_KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d --ignore-garbage > mcs-release.keystore
          ls -la mcs-release.keystore

      - name: Work out the next version code
        id: ver
        run: echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set version code/name for this build
        run: |
          node -e "
            const fs=require('fs');
            const m=JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
            m.appVersionCode = ${{ steps.ver.outputs.code }};
            m.signingKey.path = require('path').resolve('mcs-release.keystore');
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
          "

      - name: Generate the Android project from twa-manifest.json (no interactive prompts)
        run: |
          node -e "
            const path = require('path');
            const { TwaManifest, TwaGenerator, ConsoleLog } = require('@bubblewrap/core');
            (async () => {
              const manifest = await TwaManifest.fromFile('./twa-manifest.json');
              const generator = new TwaGenerator();
              const log = new ConsoleLog('build');
              await generator.createTwaProject('./android-build', manifest, log);
              await manifest.saveToFile(path.join('./android-build', 'twa-manifest.json'));
              console.log('Android project generated successfully.');
            })().catch(e => { console.error(e); process.exit(1); });
          "
          ls -la ./android-build

      - name: Open only /MCS/ links (not the whole pbtcodelabs-pbt.github.io site)
        run: |
          node -e "
            const fs = require('fs');
            const f = './android-build/app/src/main/AndroidManifest.xml';
            const scope = new URL(JSON.parse(fs.readFileSync('twa-manifest.json','utf8')).fullScopeUrl).pathname;
            let x = fs.readFileSync(f, 'utf8');
            x = x.replace(/<data([^>]*android:host=[^>]*?)\s*\/>/g,
              (m, a) => /pathPrefix/.test(a) ? m : '<data' + a + ' android:pathPrefix=\"' + scope + '\"/>');
            fs.writeFileSync(f, x);
            if (!x.includes('android:pathPrefix=\"' + scope + '\"')) { console.error('pathPrefix not added'); process.exit(1); }
            console.log('pathPrefix', scope);
          "

      - name: Build signed APK + AAB
        working-directory: ./android-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.MCS_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.MCS_KEY_PASSWORD }}
        run: printf 'no\n' | bubblewrap build --skipPwaValidation

      - name: Remove keystore file (keep it out of the uploaded artifact)
        if: always()
        run: rm -f mcs-release.keystore android-build/mcs-release.keystore

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: my-city-shines-android-v${{ steps.ver.outputs.code }}
          path: |
            android-build/app-release-signed.apk
            android-build/app-release-bundle.aab
          retention-days: 90

      # فون سے آسان ڈاؤن لوڈ: ہر بلڈ کی APK اور AAB ایک Release میں بھی لگ جاتی ہیں۔
      # لنک ہمیشہ یہی: https://github.com/pbtcodelabs-pbt/MCS/releases/latest
      - name: Publish APK + AAB as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="${{ steps.ver.outputs.code }}"
          cp android-build/app-release-bundle.aab "my-city-shines-v${code}.aab"
          cp android-build/app-release-signed.apk "my-city-shines-v${code}.apk"
          gh release create "android-v${code}" "my-city-shines-v${code}.aab" "my-city-shines-v${code}.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "My City Shines Android v${code}" \
            --notes "Play Console میں .aab فائل اپلوڈ کریں۔ .apk سیدھا فون میں انسٹال کرنے کے لیے ہے۔"
