name: Probe Firestore public write (stats)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=AIzaSyAvu8ymIZAGEPaYwd_LBJzKS2lZ3Q4_Mog
          B=https://firestore.googleapis.com/v1/projects/my-city-shines/databases/\(default\)/documents
          for c in stats recStats clicks appStats analytics; do
            echo "== create $c"
            curl -sS -X PATCH "$B/$c/probe_test?key=$K" -H 'Content-Type: application/json' -d '{"fields":{"n":{"integerValue":"1"}}}' | head -c 300; echo
          done
          echo "== commit increment stats"
          curl -sS -X POST "$B:commit?key=$K" -H 'Content-Type: application/json' -d '{"writes":[{"transform":{"document":"projects/my-city-shines/databases/(default)/documents/stats/probe_test","fieldTransforms":[{"fieldPath":"n","increment":{"integerValue":"1"}}]}}]}' | head -c 300; echo
          echo "== read appConfig"
          curl -sS "$B/appConfig?key=$K&pageSize=3" | head -c 600; echo
