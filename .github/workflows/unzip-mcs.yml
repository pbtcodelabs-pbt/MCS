name: Unzip MCS update

on:
  push:
    branches: [main]
    paths: ['MCS*.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and replace files
        run: |
          set -e
          ZIP=$(git log -1 --format= --name-only --diff-filter=AM -- 'MCS*.zip' | head -n1)
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            ZIP=$(ls MCS*.zip 2>/dev/null | head -n1 || true)
          fi
          if [ -z "$ZIP" ]; then echo "No MCS zip found"; exit 0; fi
          echo "Using $ZIP"
          unzip -o "$ZIP" index.html sw.js -d .
          git rm -q --ignore-unmatch MCS*.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Auto-update from $ZIP" || echo "Nothing to commit"
          git push
