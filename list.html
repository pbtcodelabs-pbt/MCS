<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My City Shines — فہرست</title>
<meta name="theme-color" content="#0f766e">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaleeq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* MCS11OCTSU1145AM: شیئر کی گئی لسٹ — ہر ریکارڈ الگ بارڈر والے کارڈ میں، نمبر پر کال یا واٹس ایپ کا انتخاب.
   یہی صفحہ ایپ سے بھیجی گئی HTML فائل میں بھی جاتا ہے (ڈیٹا window.MCS_LIST میں)، اور لنک سے
   کھلنے پر ڈیٹا URL کے # والے حصے سے آتا ہے۔ */
@font-face{font-family:'MCS Kasheeda';font-display:swap;
  src:url('https://pbtcodelabs-pbt.github.io/MCS/JameelNooriNastaleeqKasheeda.ttf') format('truetype');}
:root{--p:#0f766e;--pd:#0b5c56;--bd:#cfe3df;--call:#1d4ed8;--wa:#16a34a;--mut:#6b7280;}
*{box-sizing:border-box}
body{margin:0;background:#eef5f3;font-family:'Noto Nastaleeq Urdu',Tahoma,sans-serif;color:#111827}
header{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:14px 16px 12px;text-align:center}
header h1{margin:0;font-family:'MCS Kasheeda','Noto Nastaleeq Urdu',serif;font-weight:400;font-size:30px;line-height:1.6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header p{margin:2px 0 0;font-size:13px;opacity:.9;line-height:2}
.s{position:sticky;top:0;z-index:2;background:#eef5f3;padding:10px 12px}
.s input{width:100%;padding:10px 14px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;font-size:15px;background:#fff}
.l{padding:2px 12px 24px;max-width:640px;margin:0 auto}
.r{background:#fff;border:1.5px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.h{display:flex;align-items:center;gap:10px;padding:8px 12px 4px}
.no{flex:0 0 auto;min-width:30px;height:30px;border-radius:50%;background:#e6f4f1;color:var(--pd);display:flex;align-items:center;justify-content:center;
  font:700 14px Arial,sans-serif}
.nm{flex:1 1 auto;min-width:0}
.nm b{display:block;font-family:'MCS Kasheeda','Noto Nastaleeq Urdu',serif;font-weight:400;font-size:26px;line-height:1.7;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm i{display:block;font-style:normal;direction:ltr;text-align:right;color:var(--mut);font:12px Arial,sans-serif;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 6px;font-size:13px;line-height:1.9}
.m span{border:1px solid var(--bd);border-radius:20px;padding:0 10px;background:#f7fbfa;white-space:nowrap}
.m .lc{color:var(--mut)}
.a{display:flex;gap:8px;padding:8px 12px 12px;border-top:1px dashed var(--bd)}
.a a{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border-radius:10px;padding:9px 8px;white-space:nowrap}
.cl{flex:1 1 auto;background:var(--call);color:#fff;border:2px solid #1e40af;direction:ltr;font:700 17px Arial,sans-serif;letter-spacing:.5px}
.wa{flex:0 0 auto;background:var(--wa);color:#fff;border:2px solid #15803d;font-size:15px;font-weight:700}
.wa svg,.cl svg{width:18px;height:18px;flex:0 0 auto}
.none{flex:1;text-align:center;color:var(--mut);padding:8px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:6px 0 24px;line-height:2}
footer a{color:var(--p)}
.empty{text-align:center;color:var(--mut);padding:40px 16px;line-height:2.2}
</style>
</head>
<body>
<header><h1 id="t">📋 فہرست</h1><p id="sub"></p></header>
<div class="s"><input type="search" id="q" placeholder="نام، کیٹگری یا نمبر سے تلاش..." autocomplete="off"></div>
<div class="l" id="l"></div>
<footer>📞 نیلا بٹن = موبائل پر کال &nbsp;•&nbsp; سبز بٹن = واٹس ایپ<br><a href="https://pbtcodelabs-pbt.github.io/MCS/">My City Shines — مائی سٹی شائنز</a></footer>
<script>
(function(){
  var CALL='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
  var WA='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>';
  function e(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  /* d = {t:عنوان, dt:تاریخ, r:[[نام, انگلش نام, کیٹگری, اصل نمبر 03xxxxxxxxx, علاقہ/شہر], ...]} */
  function render(d){
    var rows = (d && d.r) || [];
    document.title = (d.t||'فہرست') + ' — My City Shines';
    document.getElementById('t').textContent = '📋 ' + (d.t||'فہرست');
    document.getElementById('sub').textContent = 'مائی سٹی شائنز — کل ' + rows.length + ' ریکارڈ' + (d.dt ? ' — ' + d.dt : '');
    if(!rows.length){ document.getElementById('l').innerHTML = '<div class="empty">اس لنک میں کوئی ریکارڈ نہیں</div>'; return; }
    document.getElementById('l').innerHTML = rows.map(function(x, i){
      var dg = String(x[3]||'').replace(/[^0-9]/g,''), intl = dg ? '92' + dg.replace(/^0/,'') : '';
      var shown = /^03\d{9}$/.test(dg) ? dg.slice(0,4) + '-' + dg.slice(4) : dg;
      return '<div class="r"><div class="h"><span class="no">' + (i+1) + '</span><div class="nm"><b>' + e(x[0]||x[1]) + '</b>' +
        (x[1] && x[0] ? '<i>' + e(x[1]) + '</i>' : '') + '</div></div>' +
        '<div class="m"><span>' + e(x[2]) + '</span>' + (x[4] ? '<span class="lc">📍 ' + e(x[4]) + '</span>' : '') + '</div>' +
        '<div class="a">' + (intl
          ? '<a class="cl" href="tel:+' + intl + '">' + CALL + e(shown) + '</a><a class="wa" href="https://wa.me/' + intl + '">' + WA + 'واٹس ایپ</a>'
          : '<span class="none">نمبر موجود نہیں</span>') + '</div></div>';
    }).join('');
  }
  function fromB64(s){
    s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '=';
    var bin = atob(s), u = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  function fromHash(){
    var h = location.hash.replace(/^#/,''), m = /(?:^|&)([zb])=([^&]+)/.exec(h);
    if(!m) return Promise.resolve(null);
    var bytes = fromB64(m[2]);
    if(m[1] === 'b') return Promise.resolve(JSON.parse(new TextDecoder().decode(bytes)));
    var ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(ds).text().then(JSON.parse);
  }
  var p = window.MCS_LIST ? Promise.resolve(window.MCS_LIST) : fromHash();
  p.then(function(d){ render(d || {r:[]}); })
   .catch(function(){ document.getElementById('l').innerHTML = '<div class="empty">یہ لنک کھل نہیں سکا — پورا لنک کاپی کر کے دوبارہ کھولیں</div>'; });
  document.getElementById('q').addEventListener('input', function(){
    var q = this.value.toLowerCase().replace(/[\s-]/g,'');
    document.querySelectorAll('.r').forEach(function(r){
      r.style.display = r.textContent.toLowerCase().replace(/[\s-]/g,'').indexOf(q) > -1 ? '' : 'none';
    });
  });
})();
</script>
</body>
</html>
